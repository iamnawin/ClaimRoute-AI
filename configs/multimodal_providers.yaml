# Multimodal escalation providers — Tier-2 candidate generation.
#
# DISABLED BY DEFAULT. `enabled: false` means engine/escalation refuses to make
# any network call: it returns a CONFIGURATION_ERROR result instead. Turning this
# on is a deliberate, reviewable act, not an accident of importing a module.
#
# This file NEVER contains an API key. Each provider names an environment
# variable; the key is read from the process environment at call time and is
# never written to config, logs, audit records, or test fixtures.
#
# Nothing here is wired into engine/extract.py. The adapter is a standalone
# candidate generator until a separate integration task connects it.

enabled: false

active_provider: openai

request_policy:
  # Crops only, never full pages. This mirrors model_policy.send_full_pages_externally
  # in configs/pipeline.yaml; engine/cropper.py remains the structural boundary that
  # physically bounds what can be built into a request.
  crop_only: true
  max_page_fraction: 0.25
  # An image with no recorded source-page size cannot be PROVEN to be a crop.
  # Unverifiable provenance is refused rather than assumed safe.
  require_page_provenance: true
  max_crop_bytes: 2000000
  # The adapter is for synthetic data until organiser PHI governance is confirmed
  # (docs/security_and_phi.md). A request not marked synthetic is refused.
  synthetic_data_only: true

transport:
  timeout_seconds: 30
  # Total attempts, not retries-after-the-first: 3 means at most 3 calls.
  max_attempts: 3
  backoff_initial_seconds: 0.5
  backoff_multiplier: 2.0
  backoff_max_seconds: 8.0
  # A malformed answer is a schema problem, not a transient one. Retrying it bills
  # a second time for the same defect, so it is off by default.
  retry_on_invalid_response: false

response_policy:
  # One form box cannot hold a paragraph; a longer value means it read the page.
  max_value_chars: 120

providers:
  openai:
    kind: openai_chat_completions
    model: gpt-5-nano
    endpoint: https://api.openai.com/v1/chat/completions
    api_key_env: OPENAI_API_KEY
    max_output_tokens: 200
    # Row in configs/prices.yaml — the single source of truth for model spend.
    price_row: gpt-5-nano

  openrouter:
    kind: openrouter_chat_completions
    # OpenRouter is an aggregator, so the model id is namespaced and explicit.
    # There is no default in code: a guessed id on an aggregator is how you get
    # billed for something nobody chose.
    model: qwen/qwen3.7-flash
    endpoint: https://openrouter.ai/api/v1/chat/completions
    # Fixed by the adapter. A spec cannot point this at another variable and
    # quietly borrow a different provider's key.
    api_key_env: OPENROUTER_API_KEY
    max_output_tokens: 200
    price_row: qwen-3.7-flash

# --------------------------------------------------------------------- live path
#
# Guardrails for calling a REAL, PAID provider. Everything here is off, and every
# limit is set for a first smoke test rather than for production throughput.
#
# Default behaviour permits ZERO spending. A paid call requires all of:
#   1. live_provider.enabled: true          (this file)
#   2. CLAIMROUTE_MULTIMODAL_ENABLED=true   (environment)
#   3. CLAIMROUTE_LIVE_PROVIDER_TEST=true   (environment)
#   4. OPENROUTER_API_KEY present           (environment)
#   5. the request is marked synthetic
#   6. the image is a proven field crop, not a page
#   7. the model is on the allowlist below and declares vision support
#   8. session and document budgets both have room
#   9. the request is not a duplicate
# Any one missing means no call, a typed outcome, and the field goes to human
# review. See engine/escalation/live_policy.py.
live_provider:
  enabled: false
  provider: openrouter
  # Environment flag that must ALSO be true. Separate from the adapter's own
  # enable flag so turning the adapter on for a fake provider can never turn a
  # paid provider on as a side effect.
  live_test_env: CLAIMROUTE_LIVE_PROVIDER_TEST

  # Exactly one approved model for the first smoke test. `vision: true` is a
  # declaration that is CHECKED, not decoration: a model without it is refused,
  # so a text-only id cannot be pointed at an image request.
  model_allowlist:
    - id: qwen/qwen3.7-flash
      vision: true
      # configs/prices.yaml row, verified 2026-08-02. Used only to cross-check
      # the cost OpenRouter itself reports; the provider's figure is the one of
      # record.
      price_row: qwen-3.7-flash

  # Initial smoke-test limits. NOT production calibration.
  limits:
    max_calls_per_field: 1
    max_calls_per_page: 2
    max_calls_per_document: 3
    max_calls_per_batch: 5
    max_paid_attempts_per_field: 1
    max_session_spend_usd: 0.02
    max_document_spend_usd: 0.005
    allow_fallback_models: false
    allow_parallel_paid_calls: false
    allow_automatic_reruns: false

  # A repeated request reuses the first result instead of paying twice. The
  # saving is reported as a saving — projected uncached cost is never shown as
  # zero just because a cache hit occurred.
  duplicate_policy:
    reuse_previous_result: true
