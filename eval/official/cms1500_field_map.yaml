naming_compatibility:
  description: >
    Names that differ between the CMS-1500 and UB-04 paths, or that are shared.
    Requirement: preserve both. Changing any of these breaks the other form.
  format_conditional_renames:
    - official_field: provider_npi
      nsf320_name: billing_provider_npi
      ub192_name: provider_npi
    - official_field: provider_name
      nsf320_name: billing_provider_name
      ub192_name: provider_name
  intentional_singular_plural_split:
    - cms1500: total_charge      # box 28
      ub04: total_charges        # box 47
  shared_names_both_forms:
    [patient_name, patient_dob, patient_sex, patient_address,
     patient_control_no, admission_date]
  unconditional_renames:
    - {from: referring_npi, to: referring_provider_npi}
    - {from: diagnosis_1, to: diagnosis_code_a}
    - {from: diagnosis_2, to: diagnosis_code_b}
    - {from: diagnosis_3, to: diagnosis_code_c}
    - {from: diagnosis_4, to: diagnosis_code_d}

known_limits:
  - id: service_line_cap_3
    description: >
      `claimroute_expected` iterates `record.service_lines[:3]`, so only three
      service lines are ever evaluated. The CMS-1500 form prints six rows.
      Lines 4–6 are silently dropped from both expected and scored output.
      Authoring crops for rows 4–6 would add cost with no accuracy benefit
      until the cap is lifted.
  - id: modifiers_dropped
    description: >
      Box 24D modifiers are parsed but have no alias and no policy entry.
  - id: rendering_npi_unscoreable
    description: >
      Box 24J has policy support but no official expected value.
  - id: amount_paid_unscoreable
    description: >
      Box 29 has policy support but no official expected value, and would
      normalize as text rather than money if it became scoreable.
  - id: box26_contention
    description: >
      patient_control_no and patient_account_no both target box 26.

# --------------------------------------------------------------------------
# Initial proof set — the first five crops to author, and why these five
# --------------------------------------------------------------------------
proof_fields:
  description: >
    Five fields to author crop coordinates for FIRST, before the remaining
    boxes. Eligibility was mechanical: present with a non-empty expected value
    in ALL THREE development documents (measured from the PHI-safe aggregate
    rows, not assumed), status mapped_supported, and box_ambiguous false.
    18 of the 44 evaluated names qualified.
  selection_criterion: >
    Among those 18, pick one field per NORMALIZATION FAMILY rather than five of
    the most convenient. Five text singletons would prove only that one code
    path works; one field per family means the first proof run exercises every
    branch of classify_field, so a residual routing defect in the date, money,
    quantity or code branch surfaces on five crops instead of hiding until all
    46 are authored. Two of these families (date, quantity) are exactly the
    ones that carried live defects fixed in 9c47fe2, so they are the families
    most worth re-proving against real pages.
  eligible_pool_size: 18
  selected:
    - claimroute_field: patient_dob
      cms1500_box: "3"
      normalization: date
      criticality: high
      why: >
        Covers the date branch and the highest-value component-order risk:
        printed MM|DD|YYYY across three sub-cells against a CCYYMMDD record.
        High criticality, present in all three development documents.
    - claimroute_field: line1_charges
      cms1500_box: "24F"
      normalization: money
      criticality: high
      why: >
        Covers the money branch and the decimal-alignment case that was only
        latently correct before 9c47fe2. Also the first service-line crop, so
        it proves the line{n}_ policy resolution path end to end.
    - claimroute_field: line1_units
      cms1500_box: "24G"
      normalization: quantity
      criticality: med
      why: >
        Covers the quantity branch, which carried a live defect (parser emits
        "1.0", form prints "1"). Also a single isolated glyph, so it proves the
        PSM_BLOCK crop requirement from assumptions #12 on a real page.
    - claimroute_field: federal_tax_id
      cms1500_box: "25"
      normalization: code
      criticality: high
      why: >
        The only NSF-320 field reaching the code branch, so it is the sole way
        to exercise that path on this form. High criticality with a real
        validator (tax_id_format).
    - claimroute_field: billing_provider_npi
      cms1500_box: "33a"
      normalization: text
      criticality: high
      why: >
        Covers the text branch, and specifically the format-conditional rename
        (provider_npi -> billing_provider_npi on NSF320 only). Proves the crop
        is keyed to the CMS-1500 policy entry rather than the UB-04 one, which
        is the single most likely naming mistake in the remaining 41 boxes.
        Backed by npi_checksum, so a mis-read is caught deterministically.
  deliberately_excluded:
    - field: patient_account_no
      reason: box_ambiguous (contends with patient_control_no for box 26)
    - field: patient_control_no
      reason: box_ambiguous (same contention)
    - field: diagnosis_code_b
      reason: >
        blank_but_valid, so an absent value is ACCEPTed as empty and proves
        nothing about crop accuracy.
    - field: patient_name
      reason: >
        Eligible and high criticality, but the text branch is already covered
        by billing_provider_npi, which additionally proves the rename path.

organiser_questions:
  - Confirm whether box 24J (Rendering Provider ID) is part of the official output.
  - Confirm whether box 29 (Amount Paid) is part of the official output.
  - Confirm which official field (patient_control_no or patient_account_no)
    corresponds to the printed box 26.
  - Confirm whether service lines beyond the third are in scope for scoring.
  - Confirm whether box 24D modifiers are required.
  - Confirm whether insurance_plan_name corresponds to box 11c or box 9d.
