# Official CMS-1500 (02-12) field-mapping specification — ClaimRoute AI
#
# PURPOSE
#   This file is the authoritative crosswalk between the organiser's official
#   NSF-320 output fields and the ClaimRoute schema, resolved BEFORE any crop
#   coordinate is authored. A template keyed on a name the engine does not know
#   silently receives default policy from `engine.governor.field_policy()`, so a
#   wrong name here does not raise — it quietly mis-governs a field. Authoring
#   the names first, and testing them, removes that failure mode.
#
# HOW THE NAMES WERE RESOLVED (not invented)
#   official_field  : key produced by `eval/official/parsers.py:parse_nsf_bytes`
#   claimroute_field: name emitted by `eval/official/evaluator.py:claimroute_expected`
#   normalization   : `eval/official/normalization.py:classify_field(name)`
#   validators /
#   criticality /
#   may_be_blank    : `engine/governor.py:field_policy(name)`
#   Every row was generated by calling those functions, never hand-typed, and
#   `tests/test_cms1500_field_map.py` re-derives and re-checks all of them.
#
# PHI
#   Names, box numbers, and booleans only. No organiser value, OCR text, crop,
#   or page pixel appears in this file. `present_in_dev_documents` is derived
#   from the aggregate PHI-safe rows in
#   `eval/official/results/official_sample_rows.jsonl` (field names + booleans),
#   restricted to the three development source IDs in
#   `eval/official/splits/tier_a_split_v1.json`. No holdout item was opened.
#
# STATUS VOCABULARY (requirement: these must stay distinguishable)
#   mapped_supported : official field -> real schema name -> real policy. Scored.
#   blank_but_valid  : scored, AND field_policy says optional=true, so an absent
#                      value is ACCEPTed as empty and never escalated.
#   not_printed      : exists in the official record format but is not a printed
#                      CMS-1500 box. No crop can ever be authored for it.
#   unsupported_schema: printed and/or parsed, but no scoreable path exists today.
#   ambiguous_spec   : has policy support but NO official expected value, so it
#                      is extractable yet unscoreable pending organiser input.
#
#   `status` answers "does this field reach compare_fields, and is blank legal?"
#   `box_ambiguous` is an ORTHOGONAL axis answering "is its printed location
#   settled?". A field can be fully scored and still have an uncertain box
#   (patient_account_no). Collapsing the two would hide one of them: the first
#   draft of this file marked patient_account_no `ambiguous_spec` and the
#   completeness test correctly rejected it as a scored-but-unmapped field.
#
#   `blank_but_valid` is derived from field_policy, NOT from clinical
#   expectation. Box 14 (admission_date) is routinely blank in practice but the
#   policy marks it optional=false, so it is recorded as mapped_supported.

meta:
  map_id: cms1500_official_v1
  created: 2026-07-31
  form_revision: CMS-1500 (02-12)
  official_format: NSF320
  split_id: tier_a_official_v1
  development_source_ids: [5858cb1e596e, a0ccd0f63f79, ac3175590d3e]
  holdout_untouched: true
  evaluated_field_count: 44          # names reaching compare_fields for NSF320
  service_line_cap: 3                # evaluator.py: record.service_lines[:3]
  service_line_rows_printed: 6       # CMS-1500 box 24 prints six rows

