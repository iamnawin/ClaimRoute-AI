    notes: >
      Box 14 is "Date of Current Illness/Injury/Pregnancy". On the printed form
      it is routinely blank, but `field_policy("admission_date")` returns
      optional=false, so the governor does NOT treat an empty box 14 as
      legitimately blank — an absent value will be driven toward retry rather
      than ACCEPTed as empty. This row records the behaviour the system
      actually enforces, not the clinical expectation. Whether the policy
      should mark it optional is a separate decision, deliberately not taken
      here: changing field_policy.yaml would alter governor behaviour for the
      frozen UB-04 path too (the entry lives in `ub04_fields` and governor.py
      merges `fields` and `ub04_fields` into one lookup, so it resolves for
      both forms). Name is shared with UB-04 box 12 — see naming compatibility.
      Present in zero development documents, so it cannot be validated here.

